<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1025;
            background-image: 
                radial-gradient(#2b1d38 15%, transparent 16%),
                radial-gradient(#2b1d38 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            font-family: 'Press Start 2P', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8f8f2;
            padding: 20px;
        }

        .card {
            background-color: #282a36;
            border: 4px solid #fff;
            box-shadow: 
                0 0 0 4px #282a36,
                0 0 0 8px #f1fa8c,
                8px 8px 0px 8px rgba(0,0,0,0.6);
            max-width: 550px;
            padding: 35px;
            border-radius: 4px;
            line-height: 1.8;
            font-size: 13px;
            color: #f8f8f2;
            text-align: left;
        }

        .heart-icon {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 10px;
            color: #bd93f9;
            text-decoration: none;
            border-bottom: 2px solid #bd93f9;
        }

        .back-link:hover {
            color: #f1fa8c;
            border-color: #f1fa8c;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="heart-icon">🌱✨</div>
        <p>oi! a gente começou com o pé esquerdo no evento. a verdade é que eu fugi de você. ainda podemos ser amigos? olhei seu projeto no painel, parece incrível. me conta sobre ele :)</p>
        <a href="index.html" class="back-link">← Voltar para a flor</a>
    </div>

</body>
</html>
